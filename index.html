<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f8">
<title>Super Messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#eef3f8;
  --panel:rgba(251,253,255,.88);
  --bar:rgba(248,250,253,.78);
  --border:rgba(15,23,42,.08);
  --hairline:rgba(255,255,255,.88);
  /* Sender: sleek slightly transparent soft water-like aquamarine */
  --out:linear-gradient(135deg,rgba(122,208,224,.36),rgba(164,224,234,.28));
  --out-solid:rgba(132,211,226,.34);
  --out-border:rgba(56,161,182,.28);
  /* Receiver: complementary cool pearl-mist diamond glass */
  --in:linear-gradient(135deg,rgba(232,238,245,.82),rgba(244,248,252,.72));
  --in-solid:rgba(235,241,247,.80);
  --in-border:rgba(100,116,139,.16);
  --accent:#3b8296;
  --accent-soft:rgba(59,130,150,.12);
  --green:#16a34a;
  --blue:#0284c7;
  --gray-tick:#8e96a4;
  --text:#0f172a;
  --muted:#64748b;
  --mic-soft:rgba(15,23,42,.34);
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;user-select:none}
button,input{font:inherit}button{cursor:pointer}

/* Login Screen */
#login-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.95),transparent 52%),radial-gradient(circle at 80% 85%,rgba(165,216,226,.42),transparent 55%),linear-gradient(155deg,#f6f9fc 0%,#e7eef5 100%);z-index:50}
.login-card{width:min(392px,100%);padding:40px 28px;text-align:center;background:rgba(255,255,255,.78);border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hairline),0 24px 64px rgba(15,23,42,.08);border-radius:30px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.logo-badge{width:74px;height:74px;margin:0 auto 20px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(219,236,242,.72));border:1px solid rgba(15,23,42,.08);display:grid;place-items:center;box-shadow:inset 0 1px 0 #fff,0 12px 28px rgba(15,23,42,.06)}
.login-card h1{margin:0 0 8px;font-size:27px;letter-spacing:-.5px;color:var(--text)}.login-card p{color:var(--muted);line-height:1.5;margin:0;font-size:15px}
.google-btn{width:100%;padding:15px;margin-top:26px;border:1px solid rgba(15,23,42,.1);border-radius:16px;background:rgba(255,255,255,.92);color:var(--text);font-weight:650;font-size:15px;box-shadow:0 6px 18px rgba(15,23,42,.06);transition:transform .14s,background .14s}
.google-btn:hover{background:#fff}.google-btn:active{transform:scale(.98)}

/* App Shell */
#app{display:none;width:100%;max-width:1140px;height:100dvh;margin:auto;background:var(--bg);border-inline:1px solid var(--border);position:relative;box-shadow:0 0 80px rgba(15,23,42,.05)}
#sidebar{width:360px;flex-shrink:0;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-right:1px solid var(--border);display:flex;flex-direction:column}
.ios-nav{padding:14px 16px 12px;background:var(--bar);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-bottom:1px solid var(--border)}
.nav-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.large-title{font-size:30px;font-weight:750;letter-spacing:-.6px;color:var(--text)}
.nav-actions{display:flex;gap:8px}
.pill-btn{width:35px;height:35px;border:1px solid var(--border);border-radius:50%;background:rgba(255,255,255,.72);color:var(--text);font-size:15px;display:grid;place-items:center;transition:background .15s,transform .12s}
.pill-btn:hover{background:#fff}.pill-btn:active{transform:scale(.93)}
.search-box{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.72);color:var(--text);outline:none;font-size:15px}
.search-box:focus{background:#fff;border-color:rgba(59,130,150,.35)}

/* Sidebar Contact List */
#user-list{flex:1;overflow-y:auto}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(15,23,42,.05);cursor:pointer;transition:background .15s}
.chat-row:hover{background:rgba(255,255,255,.65)}
.chat-row.active{background:rgba(132,211,226,.20)}
.avatar-wrap{position:relative;width:52px;height:52px;flex-shrink:0}
.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#dce5ee;border:1px solid rgba(255,255,255,.9)}
.online-ring{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff;display:none}
.online-ring.show{display:block}
.row-info{flex:1;min-width:0;overflow:hidden}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.row-name{font-weight:650;font-size:16px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-time{font-size:12px;color:var(--muted);flex-shrink:0}
.row-sub{display:flex;align-items:center;gap:6px;max-width:100%;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wa-peer-wave{display:inline-flex;align-items:center;gap:2px;height:13px;vertical-align:middle}
.wa-peer-wave i{display:block;width:2px;height:5px;border-radius:2px;background:var(--accent);animation:waWave .75s ease-in-out infinite alternate}
.wa-peer-wave i:nth-child(2){height:10px;animation-delay:.15s}
.wa-peer-wave i:nth-child(3){height:13px;animation-delay:.3s}
.wa-peer-wave i:nth-child(4){height:8px;animation-delay:.45s}
@keyframes waWave{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.live-activity{color:var(--accent)!important;font-weight:600}

/* Soft Diamond Chat Stage */
#chat-stage{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;background-color:#eef3f8;background-image:
  linear-gradient(135deg,rgba(255,255,255,.58) 0%,transparent 45%),
  linear-gradient(225deg,rgba(186,225,235,.28) 0%,transparent 50%),
  repeating-linear-gradient(60deg,rgba(255,255,255,.24) 0px,rgba(255,255,255,.24) 1px,transparent 1px,transparent 48px),
  repeating-linear-gradient(-60deg,rgba(15,23,42,.018) 0px,rgba(15,23,42,.018) 1px,transparent 1px,transparent 48px);
position:relative}
#empty-state{margin:auto;text-align:center;color:var(--muted);padding:24px}
#empty-state strong{display:block;color:var(--text);font-size:22px;margin:10px 0 6px}
#active-chat{display:none;flex:1;min-height:0;flex-direction:column;position:relative}

/* Header */
#chat-header{padding:10px 16px;background:var(--bar);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;z-index:5}
#back-btn{display:none;background:none;border:0;color:var(--accent);font-size:17px;font-weight:600;padding:4px 6px}
.header-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#dce5ee;flex-shrink:0;border:1px solid #fff}
.header-meta{flex:1;min-width:0}
.header-name{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}

/* Pinned Banner */
#pinned-banner{display:none;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;z-index:4}
#pinned-banner .pin-bar{width:3px;height:28px;border-radius:2px;background:var(--accent);flex-shrink:0}
#pinned-banner .pin-body{flex:1;min-width:0}
#pinned-banner .pin-label{font-size:11px;font-weight:700;color:var(--accent)}
#pinned-banner .pin-text{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pinned-unpin{background:none;border:0;color:var(--muted);font-size:15px;padding:4px}

/* Message Stream */
#messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg-row{display:flex;flex-direction:column;max-width:min(78%,500px);position:relative;touch-action:pan-y;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.msg-row.swiping{transition:none}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.msg-row.theirs{align-self:flex-start;align-items:flex-start}
.msg-row.highlight .bubble{box-shadow:0 0 0 2px var(--accent),0 10px 24px rgba(15,23,42,.12)}

.swipe-reply-icon{position:absolute;left:-36px;top:50%;transform:translateY(-50%) scale(.6);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.88);border:1px solid var(--border);color:var(--text);display:grid;place-items:center;font-size:13px;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s}
.msg-row.swipe-ready .swipe-reply-icon{opacity:1;transform:translateY(-50%) scale(1.05);background:var(--accent);color:#fff}

/* Bubbles: Water-Aquamarine Sender vs Cool Pearl-Mist Receiver */
.bubble{position:relative;padding:8px 12px 7px;border-radius:18px;font-size:15.5px;line-height:1.42;word-break:break-word;min-width:68px;user-select:text;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.mine .bubble{background:var(--out);color:#092a33;border:1px solid var(--out-border);border-bottom-right-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 4px 14px rgba(56,161,182,.09)}
.theirs .bubble{background:var(--in);color:#1e293b;border:1px solid var(--in-border);border-bottom-left-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.90),0 4px 12px rgba(100,116,139,.06)}
.mine .bubble::after{content:"";position:absolute;right:-6px;bottom:0;width:12px;height:14px;background:var(--out-solid);clip-path:polygon(0 0,0 100%,100% 100%);border-bottom-left-radius:10px}
.theirs .bubble::after{content:"";position:absolute;left:-6px;bottom:0;width:12px;height:14px;background:var(--in-solid);clip-path:polygon(100% 0,0 100%,100% 100%);border-bottom-right-radius:10px}

/* Borderless Media Bubbles */
.bubble.media-only{padding:0!important;margin:0!important;background:transparent!important;border:0!important;box-shadow:0 8px 24px rgba(15,23,42,.12)!important;border-radius:18px!important;overflow:hidden;min-width:140px}
.bubble.media-only::after{display:none!important}
.bubble.media-only .media-container{margin:0!important;padding:0!important;border:0!important;border-radius:18px!important;background:transparent!important}
.bubble.media-only .bubble-footer{position:absolute;right:8px;bottom:8px;margin:0;padding:3px 8px;border-radius:10px;background:rgba(15,23,42,.48);backdrop-filter:blur(10px);color:#fff;z-index:4}
.bubble.media-only .quoted-box{margin:6px 6px 4px;background:rgba(255,255,255,.88)}

.forwarded-tag{display:flex;align-items:center;gap:4px;font-size:11.5px;font-style:italic;color:var(--muted);margin-bottom:4px}
.quoted-box{display:flex;flex-direction:column;gap:2px;padding:6px 9px;margin-bottom:6px;border-radius:10px;background:rgba(255,255,255,.58);border-left:3px solid var(--accent);cursor:pointer;font-size:13px}
.quoted-sender{font-weight:700;font-size:11.5px;color:var(--accent)}
.quoted-text{color:var(--text);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}

.bubble-footer{display:inline-flex;align-items:center;gap:4px;float:right;margin:5px 0 -2px 10px;font-size:11px;color:var(--muted);user-select:none}
.edited-tag{font-style:italic;opacity:.85}
.tick{font-weight:750;font-size:12px;color:var(--gray-tick);transition:color .2s ease}
.tick.double{letter-spacing:-2px;padding-right:2px}
.tick.seen{color:var(--blue)}
.deleted-msg{font-style:italic;opacity:.65}

.reaction-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;margin-top:-6px;margin-inline:8px;border-radius:12px;background:rgba(255,255,255,.92);border:1px solid var(--border);font-size:13px;box-shadow:0 4px 12px rgba(15,23,42,.08);z-index:2}

/* WhatsApp-Style Media Loading Veil */
.media-container{position:relative;border-radius:14px;overflow:hidden;background:#e2e8f0;margin-bottom:5px;min-height:132px;min-width:154px;display:grid;place-items:center}
.chat-media{max-width:min(278px,72vw);max-height:330px;display:block;object-fit:cover;cursor:pointer}
.wa-media-loader{position:absolute;inset:0;background:linear-gradient(110deg,rgba(238,243,248,.72) 25%,rgba(255,255,255,.85) 50%,rgba(238,243,248,.72) 75%);background-size:220% 100%;animation:diamondShimmer 1.5s linear infinite;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:3}
@keyframes diamondShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.wa-loader-pill{width:46px;height:46px;border-radius:50%;background:rgba(15,23,42,.55);display:grid;place-items:center;position:relative;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.wa-loader-ring{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:#fff;border-right-color:rgba(255,255,255,.45);animation:waSpin .95s linear infinite}
@keyframes waSpin{to{transform:rotate(360deg)}}
.wa-loader-center{color:#fff;font-size:13px;line-height:1}

/* Voice Note Player */
.vn-player{display:flex;align-items:center;gap:10px;min-width:225px;padding:3px 2px}
.vn-play-btn{width:34px;height:34px;border:0;border-radius:50%;background:rgba(15,23,42,.10);color:var(--text);font-size:12px;display:grid;place-items:center;flex-shrink:0}
.vn-bars{display:flex;align-items:center;gap:2.5px;height:26px;flex:1;cursor:pointer}
.vn-bar{width:3px;border-radius:2px;background:rgba(15,23,42,.22);transition:background .12s,transform .12s}
.vn-bar.active{background:var(--blue)}
.vn-player.playing .vn-bar{animation:vnBeat .7s ease-in-out infinite alternate}
.vn-player.playing .vn-bar:nth-child(odd){animation-delay:.16s}
@keyframes vnBeat{from{transform:scaleY(.75)}to{transform:scaleY(1.12)}}
.vn-avatar-badge{position:relative;width:36px;height:36px;flex-shrink:0}
.vn-avatar-badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#cbd5e1}
.vn-mic-icon{position:absolute;bottom:-2px;left:-3px;width:16px;height:16px;background:var(--accent);color:#fff;border-radius:50%;display:grid;place-items:center}

/* Reply & Voice Preview Bars */
#reply-bar{display:none;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-top:1px solid var(--border);border-left:3.5px solid var(--accent)}
.reply-bar-info{flex:1;min-width:0}
.reply-bar-name{font-size:12px;font-weight:700;color:var(--accent)}
.reply-bar-text{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reply-cancel-btn{background:none;border:0;color:var(--muted);font-size:18px;padding:4px}

#vn-preview-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.92);border-top:1px solid var(--border)}
#vn-preview-audio{max-width:240px;flex:1;height:36px}

/* `+` Attachment Menu: Files, Gallery, Camera, Location */
#attach-menu{display:none;position:absolute;left:12px;bottom:68px;width:186px;padding:7px;border-radius:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--border);box-shadow:0 16px 38px rgba(15,23,42,.13);flex-direction:column;gap:2px;z-index:25}
.attach-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:14px;font-weight:500;text-align:left;transition:background .12s}
.attach-item:hover{background:rgba(15,23,42,.05)}

/* Emoji Icon Option Selector Bar + Content Panel (opens only when an option is clicked) */
#emoji-choice-bar{display:none;align-items:center;gap:8px;padding:8px 14px;background:rgba(252,253,255,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.choice-pill{padding:6px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.85);color:var(--text);font-size:13px;font-weight:600;transition:background .14s,color .14s,border-color .14s}
.choice-pill.active{background:var(--out-solid);border-color:var(--out-border);color:#092a33}

#media-drawer{display:none;flex-direction:column;background:rgba(252,253,255,.95);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--border);padding:10px 12px;max-height:230px}
.emoji-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.emoji-cats{display:flex;gap:6px;flex-wrap:wrap}
.emoji-cat-btn{background:rgba(15,23,42,.05);border:0;border-radius:10px;padding:4px 9px;color:var(--text);font-size:12px}
.emoji-cat-btn.active{background:var(--accent);color:#fff}
.custom-emoji-box{display:flex;align-items:center;gap:6px}
#custom-emoji-input{width:76px;padding:4px 8px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;text-align:center;outline:none}
#custom-emoji-add{padding:4px 10px;border-radius:9px;border:0;background:var(--accent);color:#fff;font-size:12px;font-weight:650}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;overflow-y:auto}
.emoji-item{background:none;border:0;font-size:22px;padding:4px;border-radius:8px;transition:background .1s,transform .1s}
.emoji-item:hover{background:rgba(15,23,42,.06);transform:scale(1.1)}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto}
.sticker-btn{padding:10px 6px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:24px}
.sticker-btn span{font-size:11px;color:var(--muted)}
.gif-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow-y:auto}
.gif-card{padding:12px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(132,211,226,.22));text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gif-tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(15,23,42,.08);color:var(--text)}

/* Composer + Diamond-Water Sound Frequency Recording Bar */
#composer{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--border);z-index:5;position:relative}
.composer-pill{flex:1;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.82);border:1px solid var(--border);border-radius:22px;padding:4px 10px;min-width:0;box-shadow:inset 0 1px 0 #fff}
.composer-pill input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font-size:16px;padding:7px 4px;outline:none}

/* Sleek Diamond-Water Sound Frequency Spectrum while Recording */
#freq-rec-bar{display:none;flex:1;align-items:center;gap:10px;padding:6px 12px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(132,211,226,.24));border:1px solid rgba(56,161,182,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);min-width:0}
.freq-pulse-ring{width:10px;height:10px;border-radius:50%;background:#38a1b6;box-shadow:0 0 0 4px rgba(56,161,182,.18);animation:freqRing 1.1s ease-in-out infinite}
@keyframes freqRing{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.55}}
#freq-rec-time{font-size:13px;font-variant-numeric:tabular-nums;color:#092a33;font-weight:650}
#sound-freq-canvas{flex:1;height:26px;display:block;min-width:0}

.tool-icon{background:none;border:0;color:#475569;padding:6px;border-radius:50%;display:grid;place-items:center;transition:color .14s,transform .12s}
.tool-icon:hover{color:var(--text)}.tool-icon:active{transform:scale(.92)}
.tool-icon svg,.circle-action-btn svg{width:20px;height:20px;display:block}

/* Soft translucent light-toned microphone */
.circle-action-btn{width:42px;height:42px;flex-shrink:0;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:rgba(255,255,255,.56);color:var(--mic-soft);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 12px rgba(15,23,42,.05);transition:transform .14s,background .14s,color .14s}
.circle-action-btn.send-mode{background:var(--accent);color:#fff;border-color:transparent}
.circle-action-btn.recording{background:rgba(56,161,182,.26);color:#092a33;border-color:rgba(56,161,182,.42)}

/* Long-Press Spotlight Blur Overlay */

@keyframes waFocusIn{from{opacity:0}to{opacity:1}}
.ctx-react-strip{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:26px;background:rgba(255,255,255,.94);border:1px solid var(--border);box-shadow:0 12px 30px rgba(15,23,42,.12)}
.ctx-react-btn{background:none;border:0;font-size:23px;padding:4px 6px;border-radius:50%;transition:transform .12s}
.ctx-react-btn:hover{transform:scale(1.22)}
#ctx-spotlight-stage{max-width:min(88vw,440px);padding:6px;pointer-events:none;filter:drop-shadow(0 16px 36px rgba(15,23,42,.18))}
.ctx-menu-card{width:min(255px,84vw);max-height:46dvh;overflow-y:auto;border-radius:18px;background:rgba(255,255,255,.95);border:1px solid var(--border);box-shadow:0 16px 40px rgba(15,23,42,.14);padding:6px}
.ctx-menu-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:14.5px;text-align:left;transition:background .1s}
.ctx-menu-row:hover{background:rgba(15,23,42,.05)}
.ctx-menu-row.danger{color:#dc2626}

/* Forward Modal */
#forward-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.36);backdrop-filter:blur(14px);z-index:45;align-items:center;justify-content:center;padding:20px}
.forward-card{width:min(360px,100%);max-height:72dvh;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.18)}
.forward-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-weight:700}
#forward-list{overflow-y:auto;flex:1}

/* Camera & Media Studio */
#studio-modal{display:none;position:fixed;inset:0;background:#e8eef4;z-index:30;flex-direction:column}
.studio-top{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);gap:8px}
.studio-top select{background:#fff;color:var(--text);border:1px solid var(--border);padding:7px 10px;border-radius:10px;max-width:200px}
.studio-stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative;padding:10px}
#cam-video,#edit-canvas,#preview-video{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 12px 30px rgba(15,23,42,.1)}
#cam-video{width:100%;height:100%;object-fit:contain}
.studio-bottom{padding:16px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;align-items:center}
.studio-controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.studio-controls button,.studio-top button,.studio-bottom button{border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);padding:10px 14px}
.filter-strip{display:flex;gap:8px;overflow-x:auto;max-width:100%}
.chip{padding:7px 12px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;white-space:nowrap}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#caption-overlay-input{width:min(420px,100%);padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text)}

@media(max-width:740px){

  #sidebar{width:100%}
  #chat-stage{display:none;width:100%}

}

<script>
'use strict';

let sb = null, socket = null, session = null, me = null;
let allUsers = [], activeConvoId = null, activePeer = null;
let messageStore = new Map();
let starredMessageIds = new Set();
let pinnedMessageId = null;
let replyTarget = null;
let contextTargetMsg = null;
let forwardTargetMsg = null;

let activityTimer = null, mediaRecorder = null, audioChunks = [], recordedVnBlob = null;
let audioCtx = null, analyser = null, freqRafId = null, recStartTime = 0, recTimerInterval = null;
let camStream = null, videoRecorder = null, videoChunks = [];
let rawImageObj = null, currentFilter = 'none', currentRotation = 0, editedBlob = null, editedType = 'image';

const $ = id => document.getElementById(id);
const authHeaders = () => ({ Authorization: `Bearer ${session.access_token}` });

function setActionButtonState(mode) {
  const btn = $('action-btn');
  btn.classList.remove('send-mode', 'recording');
  if (mode === 'send') {
    btn.classList.add('send-mode');
    btn.innerHTML = '<svg><use href="#ico-send"/></svg>';
  } else if (mode === 'stop') {
    btn.classList.add('recording');
    btn.innerHTML = '<svg><use href="#ico-stop"/></svg>';
  } else {
    btn.innerHTML = '<svg><use href="#ico-mic"/></svg>';
  }
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function summarizeMessage(msg) {
  if (!msg) return '';
  if (msg.deleted_for_everyone) return '🚫 This message was deleted';
  const prefix = msg.sender_id === me?.id ? 'You: ' : '';
  if (msg.msg_type === 'image') return prefix + (msg.content ? `📷 ${msg.content}` : '📷 Photo');
  if (msg.msg_type === 'video') return prefix + (msg.content ? `🎥 ${msg.content}` : '🎥 Video');
  if (msg.msg_type === 'voice') return prefix + '🎤 Voice message';
  return prefix + (msg.content || '');
}

function updateSidebarPreview(peerId, msg) {
  const u = allUsers.find(x => x.id === peerId);
  if (u) u.last_message = msg;
  const subText = $(`row-sub-text-${peerId}`);
  const timeEl = $(`row-time-${peerId}`);
  if (subText) {
    const text = summarizeMessage(msg) || u?.email || 'Tap to start chatting';
    subText.dataset.defaultSub = text;
    if (!subText.classList.contains('live-activity')) subText.textContent = text;
  }
  if (timeEl && msg?.created_at) {
    timeEl.textContent = formatTime(msg.created_at);
  }
}

/* 1 check offline | 2 gray checks online/outside chat | 2 blue checks opened/read inside chat */
function renderTickElement(msg, isUploading = false) {
  const tick = document.createElement('span');
  if (isUploading) {
    tick.className = 'tick';
    tick.textContent = '◷';
    return tick;
  }
  if (msg.status === 'seen') {
    tick.className = 'tick double seen';
    tick.textContent = '✓✓';
    return tick;
  }
  const peerOnline = !!(allUsers.find(u => u.id === activePeer?.id)?.is_online || activePeer?.is_online);
  if (msg.status === 'outside_seen' || peerOnline) {
    tick.className = 'tick double';
    tick.textContent = '✓✓';
  } else {
    tick.className = 'tick';
    tick.textContent = '✓';
  }
  return tick;
}

function refreshAllMyTicks(mode) {
  document.querySelectorAll('.msg-row.mine .tick').forEach(tick => {
    if (tick.textContent === '◷') return;
    if (mode === 'seen') {
      tick.className = 'tick double seen';
      tick.textContent = '✓✓';
    } else if (mode === 'outside_seen') {
      if (!tick.classList.contains('seen')) {
        tick.className = 'tick double';
        tick.textContent = '✓✓';
      }
    } else if (mode === 'offline') {
      if (!tick.classList.contains('seen')) {
        tick.className = 'tick';
        tick.textContent = '✓';
      }
    }
  });
}

async function boot() {
  $('google-login-btn').onclick = async () => {
    const btn = $('google-login-btn');
    btn.disabled = true;
    btn.textContent = 'Connecting...';
    try {
      const cfg = await fetch('/api/config').then(r => r.json());
      if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        throw new Error('Supabase configuration is missing from /api/config.');
      }
      sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) throw error;
    } catch (err) {
      $('login-help').textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'G  Continue with Google';
    }
  };

  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey) return;
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    if (data.session) await initApp(data.session);
    sb.auth.onAuthStateChange((_event, nextSession) => {
      if (nextSession && !session) initApp(nextSession);
    });
  } catch (err) {
    $('login-help').textContent = `Unable to initialize: ${err.message}`;
  }
}

async function initApp(userSession) {
  if (session) return;
  session = userSession;
  me = session.user;
  $('login-screen').style.display = 'none';
  $('app').style.display = 'flex';

  $('logout-btn').onclick = async () => {
    if (sb) await sb.auth.signOut();
    if (socket) socket.disconnect();
    location.reload();
  };

  $('back-btn').onclick = () => {
    $('app').classList.remove('in-chat');
    activeConvoId = null;
    activePeer = null;
    clearReplyTarget();
    document.querySelectorAll('.chat-row').forEach(r => r.classList.remove('active'));
  };

  socket = io({ auth: { token: session.access_token } });
  socket.on('connect_error', err => console.warn('Socket connection:', err.message));

  socket.on('presence:update', ({ userId, isOnline }) => {
    const u = allUsers.find(x => x.id === userId);
    if (u) u.is_online = isOnline;
    const ring = $(`ring-${userId}`);
    if (ring) ring.classList.toggle('show', !!isOnline);
    if (activePeer?.id === userId) {
      activePeer.is_online = isOnline;
      if (!$('peer-status').classList.contains('live-activity')) {
        setPeerHeaderStatus(isOnline ? 'online' : 'offline', false, false);
      }
      refreshAllMyTicks(isOnline ? 'outside_seen' : 'offline');
    }
  });

  socket.on('message:new', msg => {
    if (msg.client_msg_id) {
      const temp = $(`temp-${msg.client_msg_id}`);
      if (temp) temp.remove();
    }
    messageStore.set(msg.id, msg);

    const peerId = msg.sender_id === me.id ? activePeer?.id : msg.sender_id;
    if (peerId) updateSidebarPreview(peerId, msg);

    if (msg.sender_id !== me.id) {
      if (msg.conversation_id === activeConvoId) {
        renderMessage(msg);
        socket.emit('message:seen', { conversationId: activeConvoId });
      } else {
        socket.emit('message:outside_seen', { conversationId: msg.conversation_id });
      }
    } else if (msg.conversation_id === activeConvoId) {
      renderMessage(msg);
    }
  });

  socket.on('message:updated', msg => {
    messageStore.set(msg.id, msg);
    const peerId = msg.sender_id === me.id ? activePeer?.id : msg.sender_id;
    if (peerId) {
      const u = allUsers.find(x => x.id === peerId);
      if (u?.last_message?.id === msg.id) updateSidebarPreview(peerId, msg);
    }
    const existingRow = $(`msg-${msg.id}`);
    if (existingRow) {
      existingRow.replaceWith(buildMessageRow(msg, false));
    }
    if (pinnedMessageId === msg.id) updatePinnedBanner();
  });

  socket.on('message:reacted', ({ messageId, conversationId, emoji }) => {
    if (conversationId !== activeConvoId) return;
    applyReactionToDom(messageId, emoji);
  });

  socket.on('messages:outside_seen', ({ conversationId }) => {
    if (conversationId === activeConvoId) refreshAllMyTicks('outside_seen');
  });

  socket.on('messages:seen', ({ conversationId }) => {
    if (conversationId === activeConvoId) refreshAllMyTicks('seen');
  });

  socket.on('activity', ({ conversationId, userId, state }) => {
    if (userId === me.id) return;
    setPeerActivityVisual(userId, conversationId, state);
  });

  socket.on('haptic:tap', ({ conversationId }) => {
    if (conversationId === activeConvoId && navigator.vibrate) {
      navigator.vibrate([80, 40, 80]);
    }
  });

  setupComposerAndVoice();
  setupAttachAndEmojiOptions();
  setupContextMenu();
  setupCameraStudio();
  $('search-input').addEventListener('input', e => filterUsers(e.target.value));
  await loadUsers();
}

function makeWaWaveHtml() {

}

function setPeerActivityVisual(userId, conversationId, state) {
  const rowWave = $(`row-wave-${userId}`);
  const rowText = $(`row-sub-text-${userId}`);

  if (rowText && rowWave) {
    if (state === 'recording') {
      rowWave.innerHTML = makeWaWaveHtml();
      rowText.textContent = 'recording voice note...';
      rowText.classList.add('live-activity');
    } else if (state === 'typing') {
      rowWave.innerHTML = '';
      rowText.textContent = 'typing...';
      rowText.classList.add('live-activity');
    } else {
      rowWave.innerHTML = '';
      rowText.classList.remove('live-activity');
      rowText.textContent = rowText.dataset.defaultSub || '';
    }
  }

  if (conversationId === activeConvoId) {
    if (state === 'recording') {
      setPeerHeaderStatus('recording voice note...', true, true);
    } else if (state === 'typing') {
      setPeerHeaderStatus('typing...', true, false);
    } else {
      setPeerHeaderStatus(activePeer?.is_online ? 'online' : 'offline', false, false);
    }
  }
}

function setPeerHeaderStatus(text, isLive, showWave = false) {
  const el = $('peer-status');
  el.classList.toggle('live-activity', isLive);
  el.innerHTML = showWave
    ? `${makeWaWaveHtml()}<span>${escapeHtml(text)}</span>`

async function openDirectChat(peer) {
  activePeer = peer;
  pinnedMessageId = null;
  updatePinnedBanner();
  clearReplyTarget();
  $('emoji-choice-bar').style.display = 'none';
  $('media-drawer').style.display = 'none';
  $('attach-menu').style.display = 'none';

  document.querySelectorAll('.chat-row').forEach(r => {
    r.classList.toggle('active', r.dataset.userId === peer.id);
  });

  $('app').classList.add('in-chat');
  $('empty-state').style.display = 'none';
  $('active-chat').style.display = 'flex';
  $('peer-name').textContent = peer.display_name || peer.username || peer.email || 'User';
  $('peer-avatar').src = peer.avatar_url || '';
  setPeerHeaderStatus(peer.is_online ? 'online' : 'offline', false, false);
  $('messages').innerHTML = '<div style="margin:auto;color:#64748b">Loading messages...</div>';

  try {
    const res = await api('/api/chat/direct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ targetUserId: peer.id })
    });
    activeConvoId = res.conversationId || res.conversation_id;
    if (!activeConvoId) throw new Error('The server did not return a conversation ID.');

    const box = $('messages');
    box.innerHTML = '';
    messageStore.clear();
    const msgs = res.messages || [];
    msgs.forEach(m => messageStore.set(m.id, m));
    msgs.forEach(m => renderMessage(m));
    if (msgs.length) updateSidebarPreview(peer.id, msgs[msgs.length - 1]);
    socket.emit('message:seen', { conversationId: activeConvoId });
  } catch (err) {
    $('messages').innerHTML = `<div style="margin:auto;color:#dc2626">${escapeHtml(err.message)}</div>`;
  }
}

/* Diamond-Water Sound Frequency Spectrum while Recording */
function startSoundFrequencySpectrum(stream) {
  const recBar = $('freq-rec-bar');
  const inputPill = $('composer-input-pill');
  const canvas = $('sound-freq-canvas');
  const timerEl = $('freq-rec-time');

  inputPill.style.display = 'none';
  recBar.style.display = 'flex';
  recStartTime = Date.now();
  timerEl.textContent = '0:00';

  recTimerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - recStartTime) / 1000);
    timerEl.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }, 500);

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (AudioCtx) {
    try {
      audioCtx = new AudioCtx();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);
    } catch (_) {
      analyser = null;
    }
  }

  const drawSpectrum = () => {
    freqRafId = requestAnimationFrame(drawSpectrum);
    const w = canvas.clientWidth || 160;
    const h = canvas.clientHeight || 26;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);

    const bars = 28;
    const gap = 3;
    const barW = Math.max(2, (w - gap * (bars - 1)) / bars);

    let bins = null;
    if (analyser) {
      bins = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(bins);
    }

    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, 'rgba(56, 161, 182, 0.55)');
    grad.addColorStop(0.5, 'rgba(30, 136, 160, 0.92)');
    grad.addColorStop(1, 'rgba(100, 196, 214, 0.60)');

    for (let i = 0; i < bars; i++) {
      let norm = 0.22;
      if (bins) {
        const idx = Math.floor((i / bars) * bins.length);
        norm = Math.max(0.14, bins[idx] / 255);
      } else {
        norm = 0.22 + 0.52 * Math.abs(Math.sin(Date.now() * 0.008 + i * 0.45));
      }
      const bh = Math.max(4, norm * (h - 4));
      const x = i * (barW + gap);
      const y = (h - bh) / 2;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, barW, bh, 3);
      ctx.fill();
    }
  };
  drawSpectrum();
}

function stopSoundFrequencySpectrum() {
  if (freqRafId) cancelAnimationFrame(freqRafId);
  freqRafId = null;
  if (recTimerInterval) clearInterval(recTimerInterval);
  recTimerInterval = null;
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
    analyser = null;
  }
  $('freq-rec-bar').style.display = 'none';
  $('composer-input-pill').style.display = 'flex';
}

/* Composer & Voice Note */
function setupComposerAndVoice() {
  const input = $('input'), actionBtn = $('action-btn'), vnBar = $('vn-preview-bar'), vnAudio = $('vn-preview-audio');
  $('reply-cancel-btn').onclick = clearReplyTarget;

  input.addEventListener('input', () => {
    const hasText = input.value.trim().length > 0;
    if (mediaRecorder?.state !== 'recording') {
      setActionButtonState(hasText ? 'send' : 'mic');
    }
    if (!activeConvoId) return;
    socket.emit('activity', { conversationId: activeConvoId, state: hasText ? 'typing' : null });
    clearTimeout(activityTimer);
    activityTimer = setTimeout(() => socket.emit('activity', { conversationId: activeConvoId, state: null }), 1400);
  });

  $('composer').addEventListener('submit', e => {
    e.preventDefault();
    if (input.value.trim()) sendTextMessage();
  });

  actionBtn.onclick = async () => {
    if (!activeConvoId) return;
    if (input.value.trim()) {
      sendTextMessage();
      return;
    }
    if (mediaRecorder?.state === 'recording') {
      mediaRecorder.stop();
      stopSoundFrequencySpectrum();
      setActionButtonState('mic');
      socket.emit('activity', { conversationId: activeConvoId, state: null });
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stopSoundFrequencySpectrum();
        stream.getTracks().forEach(t => t.stop());
        recordedVnBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        vnAudio.src = URL.createObjectURL(recordedVnBlob);
        vnBar.style.display = 'flex';
      };
      mediaRecorder.start(200);
      setActionButtonState('stop');
      startSoundFrequencySpectrum(stream);
      socket.emit('activity', { conversationId: activeConvoId, state: 'recording' });
    } catch (err) {
      stopSoundFrequencySpectrum();
      alert(`Microphone permission required: ${err.message}`);
    }
  };

  $('vn-discard-btn').onclick = () => {
    recordedVnBlob = null;
    vnAudio.removeAttribute('src');
    vnBar.style.display = 'none';
  };

  $('vn-send-btn').onclick = async () => {
    if (!recordedVnBlob || !activeConvoId) return;
    const blob = recordedVnBlob;
    recordedVnBlob = null;
    vnBar.style.display = 'none';
    await optimisticUploadAndSend(blob, 'voice-note.webm', 'voice');
  };

  $('love-tap-btn').onclick = () => {
    if (activeConvoId) socket.emit('haptic:tap', { conversationId: activeConvoId, effect: 'pulse' });
  };
}

function sendTextMessage(customText = null) {
  const input = $('input');
  const content = (customText ?? input.value).trim();
  if (!content || !activeConvoId) return;

  const clientMsgId = crypto.randomUUID();
  const replyToId = replyTarget?.id || null;
  clearReplyTarget();
  $('emoji-choice-bar').style.display = 'none';
  $('media-drawer').style.display = 'none';
  $('attach-menu').style.display = 'none';
  socket.emit('activity', { conversationId: activeConvoId, state: null });

  const optimistic = {
    id: `temp-${clientMsgId}`,
    client_msg_id: clientMsgId,
    sender_id: me.id,
    reply_to_id: replyToId,
    msg_type: 'text',
    content,
    status: activePeer?.is_online ? 'outside_seen' : 'sent',
    created_at: new Date().toISOString()
  };

  renderMessage(optimistic, true);
  if (activePeer) updateSidebarPreview(activePeer.id, optimistic);

  socket.emit('message:send', {
    clientMsgId,
    conversationId: activeConvoId,
    replyToId,
    msgType: 'text',
    content
  }, ack => {
    if (ack?.error) {
      $(`temp-${clientMsgId}`)?.remove();
      alert(`Message failed: ${ack.error}`);
    }
  });

  if (customText === null) {
    input.value = '';
    setActionButtonState('mic');
  }
}

async function optimisticUploadAndSend(fileBlob, filename, forcedType) {
  if (!activeConvoId) return;
  const clientMsgId = crypto.randomUUID();
  const localUrl = URL.createObjectURL(fileBlob);
  const replyToId = replyTarget?.id || null;
  clearReplyTarget();

  const optimistic = {
    id: `temp-${clientMsgId}`,
    client_msg_id: clientMsgId,
    sender_id: me.id,
    reply_to_id: replyToId,
    msg_type: forcedType,
    media_url: localUrl,
    media_lite_url: localUrl,
    content: '',
    status: 'uploading',
    created_at: new Date().toISOString()
  };

  renderMessage(optimistic, true);
  if (activePeer) updateSidebarPreview(activePeer.id, optimistic);

  try {
    const formData = new FormData();
    formData.append('media', fileBlob, filename);
    const res = await api('/api/upload', { method: 'POST', body: formData });
    if (res.error) throw new Error(res.error);

    socket.emit('message:send', {
      clientMsgId,
      conversationId: activeConvoId,
      replyToId,
      msgType: res.msgType || forcedType,
      mediaUrl: res.url,
      mediaLiteUrl: res.liteUrl || res.url,
      content: ''
    }, ack => {
      if (ack?.error) {
        $(`temp-${clientMsgId}`)?.remove();
        alert(`Message failed: ${ack.error}`);
      }
    });
  } catch (err) {
    $(`temp-${clientMsgId}`)?.remove();
    alert(`Upload failed: ${err.message}`);
  }
}

/* Message Rendering */
function renderMessage(msg, isUploading = false) {
  const domId = isUploading ? `temp-${msg.client_msg_id}` : `msg-${msg.id}`;
  if ($(domId)) return;
  const row = buildMessageRow(msg, isUploading);
  $('messages').append(row);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function buildMessageRow(msg, isUploading = false) {
  const domId = isUploading ? `temp-${msg.client_msg_id}` : `msg-${msg.id}`;
  const isMe = msg.sender_id === me.id;
  const row = document.createElement('div');
  row.id = domId;
  row.className = `msg-row ${isMe ? 'mine' : 'theirs'}`;

  const swipeIcon = document.createElement('div');
  swipeIcon.className = 'swipe-reply-icon';
  swipeIcon.textContent = '↩';
  row.append(swipeIcon);

  const bubble = document.createElement('div');
  const isBorderlessMedia = !msg.deleted_for_everyone &&
    msg.media_url &&
    (msg.msg_type === 'image' || msg.msg_type === 'video') &&
    !msg.content;

  bubble.className = `bubble ${isBorderlessMedia ? 'media-only' : ''}`;

  if (msg.is_forwarded && !msg.deleted_for_everyone) {
    const fwd = document.createElement('div');
    fwd.className = 'forwarded-tag';
    fwd.textContent = '↪ Forwarded';
    bubble.append(fwd);
  }

  if (msg.reply_to_id && !msg.deleted_for_everyone) {
    const original = messageStore.get(msg.reply_to_id);
    const quote = document.createElement('div');
    quote.className = 'quoted-box';
    const qSender = document.createElement('div');
    qSender.className = 'quoted-sender';
    qSender.textContent = original
      ? (original.sender_id === me.id ? 'You' : (activePeer?.display_name || 'Contact'))
      : 'Replied message';
    const qText = document.createElement('div');
    qText.className = 'quoted-text';
    qText.textContent = original
      ? summarizeMessage({ ...original, sender_id: 'other' })
      : 'Original message';
    quote.append(qSender, qText);
    quote.onclick = e => {
      e.stopPropagation();
      if (original) scrollToMessage(original.id);
    };
    bubble.append(quote);
  }

  if (!msg.deleted_for_everyone && msg.media_url) {
    const wrap = document.createElement('div');
    wrap.className = 'media-container';

    if (msg.msg_type === 'image') {
      const img = document.createElement('img');
      img.src = msg.media_lite_url || msg.media_url;
      img.className = 'chat-media';
      img.alt = 'Shared image';
      img.onclick = () => {
        if (!isUploading) window.open(msg.media_url, '_blank', 'noopener');
      };
      wrap.append(img);
    } else if (msg.msg_type === 'video') {
      const vid = document.createElement('video');
      vid.src = msg.media_url;
      vid.controls = !isUploading;
      vid.playsInline = true;
      vid.className = 'chat-media';
      wrap.append(vid);
    } else if (msg.msg_type === 'voice') {
      wrap.style.background = 'transparent';
      wrap.style.marginBottom = '0';
      wrap.style.minHeight = '0';
      wrap.style.minWidth = '0';
      wrap.append(
        buildWaVoicePlayer(
          msg.media_url,
          isMe ? (me.user_metadata?.avatar_url || '') : activePeer?.avatar_url
        )
      );
    }

    if (isUploading) {
      const veil = document.createElement('div');
      veil.className = 'wa-media-loader';
      veil.innerHTML = `
        <div class="wa-loader-pill">
          <div class="wa-loader-ring"></div>
          <span class="wa-loader-center">${msg.msg_type === 'video' ? '▶' : '↑'}</span>
        </div>
      `;
      wrap.append(veil);
    }

    bubble.append(wrap);
  }

  if (msg.content || msg.deleted_for_everyone) {
    const txt = document.createElement('span');
    txt.id = `text-${msg.id}`;
    txt.className = msg.deleted_for_everyone ? 'deleted-msg' : '';
    txt.textContent = msg.deleted_for_everyone ? 'This message was deleted' : msg.content;
    bubble.append(txt);
  }

  const footer = document.createElement('span');
  footer.className = 'bubble-footer';
  if (starredMessageIds.has(msg.id) && !msg.deleted_for_everyone) {
    const star = document.createElement('span');
    star.textContent = '★';
    footer.append(star);
  }
  if (msg.is_edited && !msg.deleted_for_everyone) {
    const ed = document.createElement('span');
    ed.className = 'edited-tag';
    ed.textContent = 'edited';
    footer.append(ed);
  }
  const time = document.createElement('span');
  time.textContent = formatTime(msg.created_at);
  footer.append(time);

  if (isMe) {
    footer.append(renderTickElement(msg, isUploading));
  }

  bubble.append(footer);
  row.append(bubble);

  if (!isUploading) {
    attachBubbleGestures(row, bubble, msg);
  }

  return row;
}

function attachBubbleGestures(row, bubble, msg) {
  let startX = 0, startY = 0, deltaX = 0, swiping = false, pressTimer = null;

  const startHold = () => {
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      if (navigator.vibrate) navigator.vibrate(20);
      openContextMenu(msg, bubble);
    }, 420);
  };

  const cancelHold = () => clearTimeout(pressTimer);

  row.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    deltaX = 0;
    swiping = false;
    startHold();
  }, { passive: true });

  row.addEventListener('touchmove', e => {
    if (e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) cancelHold();
    if (dx > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      swiping = true;
      row.classList.add('swiping');
      deltaX = Math.min(dx, 76);
      row.style.transform = `translateX(${deltaX}px)`;
      row.classList.toggle('swipe-ready', deltaX >= 52);
    }
  }, { passive: true });

  row.addEventListener('touchend', () => {
    cancelHold();
    if (swiping) {
      row.classList.remove('swiping', 'swipe-ready');
      row.style.transform = '';
      if (deltaX >= 52 && !msg.deleted_for_everyone) {
        if (navigator.vibrate) navigator.vibrate(15);
        setReplyTarget(msg);
      }
      swiping = false;
    }
  });

  row.addEventListener('touchcancel', () => {
    cancelHold();
    row.classList.remove('swiping', 'swipe-ready');
    row.style.transform = '';
  });

  bubble.addEventListener('contextmenu', e => {
    e.preventDefault();
    openContextMenu(msg, bubble);
  });
}

function buildWaVoicePlayer(url, avatarUrl) {
  const container = document.createElement('div');
  container.className = 'vn-player';

  const play = document.createElement('button');
  play.type = 'button';
  play.className = 'vn-play-btn';
  play.textContent = '▶';

  const bars = document.createElement('div');
  bars.className = 'vn-bars';
  const heights = [7, 13, 18, 11, 22, 15, 9, 17, 23, 13, 8, 16, 20, 12, 7, 15, 21, 10, 14, 18, 8, 12, 17, 9];
  const barEls = heights.map(h => {
    const b = document.createElement('div');
    b.className = 'vn-bar';
    b.style.height = `${h}px`;
    bars.append(b);
    return b;
  });

  const badge = document.createElement('div');
  badge.className = 'vn-avatar-badge';
  const img = document.createElement('img');
  img.src = avatarUrl || '';
  img.alt = '';
  img.onerror = () => (img.style.opacity = '.35');
  const mic = document.createElement('span');
  mic.className = 'vn-mic-icon';
  mic.innerHTML = '<svg width="9" height="9"><use href="#ico-mic"/></svg>';
  badge.append(img, mic);

  const audio = new Audio(url);
  play.onclick = () => {
    if (audio.paused) {
      audio.play().then(() => {
        play.textContent = '❚❚';
        container.classList.add('playing');
      }).catch(() => {});
    } else {
      audio.pause();
      play.textContent = '▶';
      container.classList.remove('playing');
    }
  };

  bars.onclick = e => {
    if (!audio.duration) return;
    const rect = bars.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
  };

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    const count = Math.floor((audio.currentTime / audio.duration) * barEls.length);
    barEls.forEach((b, i) => b.classList.toggle('active', i <= count));
  };

  audio.onended = () => {
    play.textContent = '▶';
    container.classList.remove('playing');
    barEls.forEach(b => b.classList.remove('active'));
  };

  container.append(play, bars, badge);
  return container;
}

/* `+` Menu (Files, Gallery, Camera, Location) & Emoji -> Emoji / GIF / Sticker Options */
function setupAttachAndEmojiOptions() {
  const attachBtn = $('attach-btn');
  const attachMenu = $('attach-menu');
  const filesPicker = $('files-picker');
  const mediaPicker = $('media-picker');

  attachBtn.onclick = e => {
    e.stopPropagation();
    $('emoji-choice-bar').style.display = 'none';
    $('media-drawer').style.display = 'none';
    attachMenu.style.display = attachMenu.style.display === 'flex' ? 'none' : 'flex';
  };

  document.addEventListener('click', e => {
    if (!attachMenu.contains(e.target) && e.target !== attachBtn) {
      attachMenu.style.display = 'none';
    }
  });

  attachMenu.querySelectorAll('.attach-item').forEach(btn => {
    btn.onclick = async () => {
      const kind = btn.dataset.pick;
      attachMenu.style.display = 'none';
      if (!activeConvoId) return;

      if (kind === 'files') {
        filesPicker.click();
      } else if (kind === 'gallery') {
        mediaPicker.click();
      } else if (kind === 'camera') {
        $('studio-modal').style.display = 'flex';
        resetStudioToLiveCam();
        await populateCameras();
        await startCamStream($('cam-select').value);
      } else if (kind === 'location') {
        sendTextMessage('📍 Shared Location: 6.5244° N, 3.3792° E');
      }
    };
  });

  filesPicker.onchange = () => {
    const file = filesPicker.files[0];
    if (!file) return;
    filesPicker.value = '';
    sendTextMessage(`📎 ${file.name} (${Math.max(1, Math.round(file.size / 1024))} KB)`);
  };

  const categories = {
    '😀 Smileys': ['😀','😂','🥹','😍','🥰','😎','🤩','🥳','🤔','😅','😭','🫡','🫶','❤️','✨','💯','🙌','🌸','❄️','💎'],
    '👋 Gestures': ['👍','👎','👏','🙏','🤝','✌️','🤞','👌','🤙','💪','👀','🎉','🎊','💐','🌟','⚡','🌊','🕊️'],
    '🍕 Food': ['🍕','🍔','🍟','🌮','🍣','🍩','🍪','☕','🧃','🍉','🍓','🥑','🍿','🎂','🥂','🍫']
  };
  const stickers = [
    { icon: '💎', label: 'Diamond' },
    { icon: '🌊', label: 'Water' },
    { icon: '✨', label: 'Sparkle' },
    { icon: '🫶', label: 'Care' },
    { icon: '☕', label: 'Coffee' },
    { icon: '🌸', label: 'Bloom' },
    { icon: '🎉', label: 'Cheers' },
    { icon: '🌙', label: 'Night' }
  ];
  const gifs = [
    { title: 'Water Ripple Loop', tag: 'GIF', text: '🌊 [GIF: Water Ripple Loop]' },
    { title: 'Diamond Prism Shine', tag: 'GIF', text: '💎 [GIF: Diamond Prism Shine]' },
    { title: 'Soft Breeze', tag: 'GIF', text: '✨ [GIF: Soft Breeze]' },
    { title: 'Ping You Soon', tag: 'GIF', text: '⚡ [GIF: Ping You Soon]' }
  ];

  const choiceBar = $('emoji-choice-bar');
  const drawer = $('media-drawer');
  const catsEl = $('emoji-cats');
  const gridEl = $('emoji-grid');
  const input = $('input');
  let activeCat = Object.keys(categories)[0];
  let openOption = null;

  function insertTextAtCursor(val) {
    if (!val) return;
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0, start) + val + input.value.slice(end);
    input.focus();
    input.selectionStart = input.selectionEnd = start + val.length;
    input.dispatchEvent(new Event('input'));
  }

  function renderCategory(catName) {
    activeCat = catName;
    catsEl.querySelectorAll('.emoji-cat-btn').forEach(b => b.classList.toggle('active', b.textContent === catName));
    gridEl.innerHTML = '';
    categories[catName].forEach(emo => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'emoji-item';
      btn.textContent = emo;
      btn.onclick = () => insertTextAtCursor(emo);
      gridEl.append(btn);
    });
  }

  Object.keys(categories).forEach(name => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'emoji-cat-btn';
    btn.textContent = name;
    btn.onclick = () => renderCategory(name);
    catsEl.append(btn);
  });

  $('custom-emoji-add').onclick = () => {
    const custom = $('custom-emoji-input').value.trim();
    if (!custom) return;
    categories[activeCat].unshift(custom);
    $('custom-emoji-input').value = '';
    renderCategory(activeCat);
    insertTextAtCursor(custom);
  };

  renderCategory(activeCat);

  const gifPanel = $('gif-panel');
  gifs.forEach(g => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gif-card';
    b.innerHTML = `<span>${escapeHtml(g.title)}</span><span class="gif-tag">${g.tag}</span>`;
    b.onclick = () => {
      if (!activeConvoId) return;
      sendTextMessage(g.text);
    };
    gifPanel.append(b);
  });

  const stickerPanel = $('sticker-panel');
  stickers.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sticker-btn';
    b.innerHTML = `<div>${s.icon}</div><span>${escapeHtml(s.label)}</span>`;
    b.onclick = () => {
      if (!activeConvoId) return;
      sendTextMessage(`${s.icon} ${s.label}`);
    };
    stickerPanel.append(b);
  });

  function showOptionPanel(opt) {
    $('emoji-panel').style.display = opt === 'emoji' ? 'block' : 'none';
    $('gif-panel').style.display = opt === 'gif' ? 'grid' : 'none';
    $('sticker-panel').style.display = opt === 'sticker' ? 'grid' : 'none';
    drawer.style.display = opt ? 'flex' : 'none';
  }

  choiceBar.querySelectorAll('.choice-pill').forEach(pill => {
    pill.onclick = () => {
      const target = pill.dataset.open;
      if (openOption === target) {
        openOption = null;
        pill.classList.remove('active');
        showOptionPanel(null);
        return;
      }
      openOption = target;
      choiceBar.querySelectorAll('.choice-pill').forEach(p => p.classList.toggle('active', p === pill));
      showOptionPanel(target);
    };
  });

  $('emoji-btn').onclick = e => {
    e.stopPropagation();
    attachMenu.style.display = 'none';
    const isBarOpen = choiceBar.style.display === 'flex';
    if (isBarOpen) {
      choiceBar.style.display = 'none';
      openOption = null;
      choiceBar.querySelectorAll('.choice-pill').forEach(p => p.classList.remove('active'));
      showOptionPanel(null);
    } else {
      choiceBar.style.display = 'flex';
      showOptionPanel(null);
    }
  };
}

/* Long-Press Spotlight Blur Menu */
function setupContextMenu() {
  const backdrop = $('context-backdrop');
  backdrop.onclick = e => {
    if (e.target === backdrop) closeContextMenu();
  };

  document.querySelectorAll('.ctx-react-btn').forEach(btn => {
    btn.onclick = () => {
      if (!contextTargetMsg || !activeConvoId) return;
      const emoji = btn.dataset.emoji;
      applyReactionToDom(contextTargetMsg.id, emoji);
      socket.emit('message:react', {
        messageId: contextTargetMsg.id,
        conversationId: activeConvoId,
        emoji
      });
      closeContextMenu();
    };
  });

  $('forward-close-btn').onclick = () => {
    $('forward-modal').style.display = 'none';
    forwardTargetMsg = null;
  };
}

function applyReactionToDom(messageId, emoji) {
  const row = $(`msg-${messageId}`);
  if (!row) return;
  let pill = row.querySelector('.reaction-pill');
  if (!pill) {
    pill = document.createElement('div');
    pill.className = 'reaction-pill';
    row.append(pill);
  }
  pill.textContent = emoji;
}

function openContextMenu(msg, bubbleEl) {
  contextTargetMsg = msg;
  const backdrop = $('context-backdrop');
  const stage = $('ctx-spotlight-stage');
  const menuCard = $('ctx-menu-card');

  stage.innerHTML = '';
  const clone = bubbleEl.cloneNode(true);
  clone.style.margin = '0';
  stage.append(clone);

  const isMine = msg.sender_id === me.id;
  const isDeleted = !!msg.deleted_for_everyone;
  const isText = (msg.msg_type || 'text') === 'text';
  const isStarred = starredMessageIds.has(msg.id);

  const items = [
    { icon: '↩️', label: 'Reply', show: !isDeleted, run: () => setReplyTarget(msg) },
    {
      icon: '📋', label: 'Copy', show: !isDeleted && !!(msg.content || msg.media_url),
      run: () => navigator.clipboard?.writeText(msg.content || msg.media_url || '')
    },
    { icon: '↪️', label: 'Forward', show: !isDeleted, run: () => openForwardModal(msg) },
    {
      icon: isStarred ? '☆' : '★',
      label: isStarred ? 'Unstar' : 'Star',
      show: !isDeleted,
      run: () => {
        if (starredMessageIds.has(msg.id)) starredMessageIds.delete(msg.id);
        else starredMessageIds.add(msg.id);
        const existingRow = $(`msg-${msg.id}`);
        if (existingRow) existingRow.replaceWith(buildMessageRow(msg, false));
      }
    },
    {
      icon: '📌',
      label: pinnedMessageId === msg.id ? 'Unpin' : 'Pin',
      show: !isDeleted,
      run: () => {
        pinnedMessageId = pinnedMessageId === msg.id ? null : msg.id;
        updatePinnedBanner();
      }
    },
    {
      icon: 'ℹ️',
      label: 'Info',
      show: true,
      run: () => {
        const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleString() : 'Unknown';
        alert(`Status: ${msg.status || 'sent'}\nTime: ${timeStr}`);
      }
    },
    {
      icon: '🔐',
      label: 'Verify Security Code',
      show: true,
      run: () => {
        const raw = `${activeConvoId || ''}:${msg.id || ''}`;
        const code = Array.from(raw).reduce((acc, ch) => ((acc * 31 + ch.charCodeAt(0)) % 1000000), 7);
        alert(`Security Code:\n${String(code).padStart(6, '0')} · ${String(code + 137921).slice(0, 6)}`);
      }
    },
    {
      icon: '✏️',
      label: 'Edit',
      show: isMine && isText && !isDeleted,
      run: () => {
        const next = prompt('Edit message:', msg.content || '');
        if (next?.trim()) {
          socket.emit('message:edit', {
            messageId: msg.id,
            conversationId: activeConvoId,
            newContent: next.trim()
          });
        }
      }
    },
    {
      icon: '🗑️',
      label: 'Delete',
      danger: true,
      show: isMine && !isDeleted,
      run: () => {
        if (confirm('Delete this message for everyone?')) {
          socket.emit('message:delete', { messageId: msg.id, conversationId: activeConvoId });
        }
      }
    }
  ];

  menuCard.innerHTML = '';
  items.filter(it => it.show).forEach(it => {
    const rowBtn = document.createElement('button');
    rowBtn.type = 'button';
    rowBtn.className = `ctx-menu-row ${it.danger ? 'danger' : ''}`;
    rowBtn.innerHTML = `<span>${it.label}</span><span>${it.icon}</span>`;
    rowBtn.onclick = () => {
      closeContextMenu();
      it.run();
    };
    menuCard.append(rowBtn);
  });

  backdrop.style.display = 'flex';
}

function closeContextMenu() {
  $('context-backdrop').style.display = 'none';
  contextTargetMsg = null;
}

function openForwardModal(msg) {
  forwardTargetMsg = msg;
  const list = $('forward-list');
  list.innerHTML = '';
  allUsers.filter(u => u.id !== me.id).forEach(u => {
    const item = document.createElement('div');
    item.className = 'chat-row';
    item.innerHTML = `<img class="avatar" style="width:40px;height:40px" src="${escapeHtml(u.avatar_url || '')}" alt=""><div class="row-info"><div class="row-name">${escapeHtml(u.display_name || u.username || u.email)}</div></div>`;
    item.onclick = async () => {
      $('forward-modal').style.display = 'none';
      const targetMsg = forwardTargetMsg;
      forwardTargetMsg = null;
      if (!targetMsg) return;
      try {
        const res = await api('/api/chat/direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetUserId: u.id })
        });
        const convoId = res.conversationId || res.conversation_id;
        socket.emit('message:send', {
          clientMsgId: crypto.randomUUID(),
          conversationId: convoId,
          msgType: targetMsg.msg_type || 'text',
          content: targetMsg.content || '',
          mediaUrl: targetMsg.media_url || null,
          mediaLiteUrl: targetMsg.media_lite_url || null,
          isForwarded: true
        });
        await openDirectChat(u);
      } catch (err) {
        alert(`Forward failed: ${err.message}`);
      }
    };
    list.append(item);
  });
  $('forward-modal').style.display = 'flex';
}

/* Camera & Media Studio */
function setupCameraStudio() {
  const modal = $('studio-modal'), camSelect = $('cam-select'), camVideo = $('cam-video'), canvas = $('edit-canvas'), picker = $('media-picker');

  picker.onchange = () => {
    const file = picker.files[0];
    if (!file) return;
    picker.value = '';
    modal.style.display = 'flex';
    stopCamStream();
    if (file.type.startsWith('video/')) {
      openVideoPreview(file);
    } else {
      const img = new Image();
      img.onload = () => openPhotoEditor(img);
      img.onerror = () => alert('Could not open this image.');
      img.src = URL.createObjectURL(file);
    }
  };

  camSelect.onchange = () => startCamStream(camSelect.value);

  $('studio-close-btn').onclick = () => {
    stopCamStream();
    if (videoRecorder?.state === 'recording') videoRecorder.stop();
    modal.style.display = 'none';
  };

  $('snap-photo-btn').onclick = () => {
    if (!camVideo.videoWidth) return;
    const temp = document.createElement('canvas');
    temp.width = camVideo.videoWidth;
    temp.height = camVideo.videoHeight;
    temp.getContext('2d').drawImage(camVideo, 0, 0);
    const img = new Image();
    img.onload = () => {
      stopCamStream();
      openPhotoEditor(img);
    };
    img.src = temp.toDataURL('image/jpeg', 0.92);
  };

  const rec = $('rec-video-btn');
  rec.onclick = () => {
    if (videoRecorder?.state === 'recording') {
      videoRecorder.stop();
      rec.textContent = '🔴 Record Video';
      return;
    }
    if (!camStream) return;
    videoChunks = [];
    try {
      videoRecorder = new MediaRecorder(camStream);
    } catch (err) {
      alert(`Video recording is unavailable: ${err.message}`);
      return;
    }
    videoRecorder.ondataavailable = e => { if (e.data.size) videoChunks.push(e.data); };
    videoRecorder.onstop = () => {
      const blob = new Blob(videoChunks, { type: videoRecorder.mimeType || 'video/webm' });
      stopCamStream();
      openVideoPreview(blob);
    };
    videoRecorder.start(200);
    rec.textContent = '⏹ Stop Video';
  };

  document.querySelectorAll('#filter-strip .chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('#filter-strip .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderEditedCanvas();
    };
  });

  $('rotate-btn').onclick = () => {
    currentRotation = (currentRotation + 90) % 360;
    renderEditedCanvas();
  };

  $('caption-overlay-input').addEventListener('input', renderEditedCanvas);

  $('retake-btn').onclick = async () => {
    resetStudioToLiveCam();
    await populateCameras();
    await startCamStream(camSelect.value);
  };

  $('studio-send-btn').onclick = async () => {
    modal.style.display = 'none';
    if (editedType === 'video') {
      await optimisticUploadAndSend(editedBlob, 'video.webm', 'video');
    } else {
      canvas.toBlob(async blob => {
        if (blob) await optimisticUploadAndSend(blob, 'photo.jpg', 'image');
      }, 'image/jpeg', 0.9);
    }
    stopCamStream();
  };
}

async function populateCameras() {
  if (!navigator.mediaDevices?.enumerateDevices) return;
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  const select = $('cam-select');
  select.innerHTML = '';
  cams.forEach((c, i) => {
    const opt = document.createElement('option');
    opt.value = c.deviceId;
    opt.textContent = c.label || `Camera ${i + 1}`;
    select.append(opt);
  });
}

async function startCamStream(deviceId) {
  stopCamStream();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : true,
      audio: true
    });
    $('cam-video').srcObject = camStream;
    await $('cam-video').play();
  } catch (err) {
    alert(`Camera error: ${err.message}`);
  }
}

function stopCamStream() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
}

function resetStudioToLiveCam() {
  $('cam-video').style.display = 'block';
  $('edit-canvas').style.display = 'none';
  $('preview-video').style.display = 'none';
  $('cam-controls').style.display = 'flex';
  $('edit-controls').style.display = 'none';
  $('studio-send-btn').style.display = 'none';
  $('rec-video-btn').textContent = '🔴 Record Video';
}

function openPhotoEditor(img) {
  editedType = 'image';
  rawImageObj = img;
  currentFilter = 'none';
  currentRotation = 0;
  $('caption-overlay-input').value = '';
  document.querySelectorAll('#filter-strip .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'none'));
  $('cam-video').style.display = 'none';
  $('preview-video').style.display = 'none';
  $('edit-canvas').style.display = 'block';
  $('cam-controls').style.display = 'none';
  $('edit-controls').style.display = 'flex';
  $('studio-send-btn').style.display = 'inline-block';
  renderEditedCanvas();
}

function openVideoPreview(blob) {
  editedType = 'video';
  editedBlob = blob;
  $('cam-video').style.display = 'none';
  $('edit-canvas').style.display = 'none';
  $('preview-video').style.display = 'block';
  $('preview-video').src = URL.createObjectURL(blob);
  $('cam-controls').style.display = 'none';
  $('edit-controls').style.display = 'none';
  $('studio-send-btn').style.display = 'inline-block';
}

function renderEditedCanvas() {
  if (!rawImageObj) return;
  const canvas = $('edit-canvas');
  const swap = currentRotation === 90 || currentRotation === 270;
  canvas.width = swap ? rawImageObj.height : rawImageObj.width;
  canvas.height = swap ? rawImageObj.width : rawImageObj.height;

  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.filter = currentFilter;
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate((currentRotation * Math.PI) / 180);
  ctx.drawImage(rawImageObj, -rawImageObj.width / 2, -rawImageObj.height / 2);
  ctx.restore();

  const caption = $('caption-overlay-input').value.trim();
  if (caption) {
    ctx.fillStyle = 'rgba(15,23,42,.55)';
    ctx.fillRect(0, canvas.height * 0.78, canvas.width, canvas.height * 0.12);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(18, Math.floor(canvas.width / 22))}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(caption, canvas.width / 2, canvas.height * 0.855, canvas.width * 0.9);
  }
}

boot();
