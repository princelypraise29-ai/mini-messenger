<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Messenger</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    :root {
      --bg: #0b0e14;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent: linear-gradient(135deg, #00d2ff 0%, #7b2ff7 100%);
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    body.theme-rose {
      --bg: #140b12;
      --accent: linear-gradient(135deg, #ff4b8b 0%, #ff8e53 100%);
    }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; justify-content: center; overflow: hidden;
      background-image: radial-gradient(circle at 15% 15%, rgba(123, 47, 247, 0.18), transparent 40%),
                        radial-gradient(circle at 85% 85%, rgba(0, 210, 255, 0.15), transparent 40%);
    }
    #app {
      width: 100%; max-width: 960px; height: 100dvh; display: flex;
      background: rgba(15, 19, 28, 0.75); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
    }
    #login-screen {
      margin: auto; text-align: center; padding: 36px 28px; max-width: 380px; width: 90%;
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .logo-orb {
      width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 22px;
      background: var(--accent); display: grid; place-items: center; font-size: 30px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
    }
    .google-btn {
      width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 16px;
      font-weight: 600; cursor: pointer; background: white; color: #111;
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 22px;
    }
    #sidebar {
      width: 340px; border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column; height: 100%;
    }
    .top-bar {
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
    }
    .user-pill { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      background: var(--accent); display: grid; place-items: center; font-weight: bold;
    }
    .icon-btn {
      background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
      padding: 8px 11px; border-radius: 12px; cursor: pointer; font-size: 14px;
    }
    .icon-btn.recording {
      background: #ef4444; border-color: #ef4444; color: white; animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .section-label {
      padding: 12px 16px 6px; font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted);
    }
    #user-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .contact-card {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 16px;
      background: var(--glass); border: 1px solid transparent; cursor: pointer; transition: 0.2s;
    }
    .contact-card:hover, .contact-card.active {
      border-color: rgba(0, 210, 255, 0.45); background: rgba(255,255,255,0.1);
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #4b5563; margin-left: auto;
    }
    .status-dot.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
    #chat-stage { flex: 1; display: flex; flex-direction: column; height: 100%; }
    #chat-header {
      padding: 14px 18px; border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2);
    }
    #back-btn { display: none; }
    #messages {
      flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg-wrap { display: flex; flex-direction: column; max-width: 76%; }
    .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.theirs { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4;
      word-break: break-word; position: relative;
    }
    .mine .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .theirs .bubble {
      background: var(--glass); border: 1px solid var(--glass-border);
      color: var(--text); border-bottom-left-radius: 4px;
    }
    .chat-media {
      max-width: 240px; max-height: 280px; border-radius: 12px; display: block; margin-bottom: 4px;
    }
    audio.chat-audio { max-width: 220px; height: 36px; display: block; }
    .deleted-msg { font-style: italic; opacity: 0.65; }
    .meta-row { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; }
    .msg-actions span { cursor: pointer; text-decoration: underline; margin-left: 6px; }
    #typing-bar { padding: 0 18px 6px; font-size: 12px; color: #38bdf8; min-height: 20px; }
    #form {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px;
      border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.25);
    }
    #input {
      flex: 1; padding: 11px 15px; border-radius: 20px; border: 1px solid var(--glass-border);
      background: var(--glass); color: white; font-size: 15px; outline: none; min-width: 0;
    }
    #send-btn {
      padding: 11px 18px; border: none; border-radius: 20px; background: var(--accent);
      color: white; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    #empty-state { margin: auto; text-align: center; color: var(--muted); padding: 20px; }
    @media (max-width: 720px) {
      #sidebar { width: 100%; }
      #chat-stage { display: none; width: 100%; }
      #app.in-chat #sidebar { display: none; }
      #app.in-chat #chat-stage { display: flex; }
      #back-btn { display: inline-block; }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="logo-orb">⚡</div>
    <h2 style="margin:0 0 8px;">Super Messenger</h2>
    <p style="margin:0;color:var(--muted);font-size:14px;">Next-gen private chats, live presence & creator statuses.</p>
    <button class="google-btn" id="google-login-btn">
      <span>G</span> Continue with Google (Gmail)
    </button>
  </div>

  <div id="app" style="display:none;">
    <div id="sidebar">
      <div class="top-bar">
        <div class="user-pill">
          <img id="me-avatar" class="avatar" src="" alt="" />
          <div>
            <div id="me-name" style="font-weight:600;font-size:14px;">Loading...</div>
            <div style="font-size:11px;color:#10b981;">● Online</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="icon-btn" id="theme-btn" title="Switch Theme">🎨</button>
          <button class="icon-btn" id="logout-btn" title="Sign Out">Exit</button>
        </div>
      </div>
      <div class="section-label">People on Super Messenger</div>
      <div id="user-list"></div>
    </div>

    <div id="chat-stage">
      <div id="empty-state">
        <div style="font-size:40px;margin-bottom:10px;">💬</div>
        <div>Select anyone on the left to start an encrypted private chat</div>
      </div>

      <div id="active-chat" style="display:none;flex-direction:column;height:100%;">
        <div id="chat-header">
          <button class="icon-btn" id="back-btn">←</button>
          <img id="peer-avatar" class="avatar" src="" alt="" />
          <div>
            <div id="peer-name" style="font-weight:600;">User</div>
            <div id="peer-status" style="font-size:12px;color:var(--muted);">Offline</div>
          </div>
          <button class="icon-btn" id="love-tap-btn" style="margin-left:auto;" title="Send Vibe Pulse">✨ Pulse</button>
        </div>
        <div id="messages"></div>
        <div id="typing-bar"></div>
        <form id="form">
          <input type="file" id="media-picker" accept="image/*,video/*" style="display:none;" />
          <button type="button" class="icon-btn" id="attach-btn" title="Send Photo or Video">📎</button>
          <button type="button" class="icon-btn" id="voice-btn" title="Record Voice Note">🎤</button>
          <input id="input" autocomplete="off" placeholder="Write a message..." />
          <button id="send-btn">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let sb, socket, session, me, activeConvoId = null, activePeer = null, typingTimeout;
    let mediaRecorder = null, audioChunks = [];

    async function boot() {
      const btn = document.getElementById('google-login-btn');
      btn.onclick = async () => {
        btn.textContent = 'Connecting to Google...';
        try {
          if (!sb) {
            const cfg = await fetch('/api/config').then(r => r.json());
            sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
          }
          const { error } = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin }
          });
          if (error) alert('Login error: ' + error.message);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const cfg = await fetch('/api/config').then(r => r.json());
      if (window.supabase && cfg.supabaseUrl) {
        sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        const { data } = await sb.auth.getSession();
        if (data.session) initApp(data.session);
      }
    }

    async function initApp(userSession) {
      session = userSession;
      me = session.user;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';

      document.getElementById('me-name').textContent = me.user_metadata?.full_name || me.email;
      document.getElementById('me-avatar').src = me.user_metadata?.avatar_url || '';

      document.getElementById('theme-btn').onclick = () => document.body.classList.toggle('theme-rose');
      document.getElementById('logout-btn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
      document.getElementById('back-btn').onclick = () => document.getElementById('app').classList.remove('in-chat');

      socket = io({ auth: { token: session.access_token } });

      socket.on('presence:update', ({ userId, isOnline }) => {
        const dot = document.getElementById(`dot-${userId}`);
        if (dot) dot.classList.toggle('online', isOnline);
        if (activePeer && activePeer.id === userId) {
          document.getElementById('peer-status').textContent = isOnline ? '● Online now' : 'Offline';
        }
      });

      socket.on('message:new', (msg) => {
        if (msg.conversation_id === activeConvoId) {
          renderMessage(msg);
          if (msg.sender_id !== me.id) socket.emit('message:seen', { conversationId: activeConvoId });
        }
      });

      socket.on('message:updated', (msg) => {
        const el = document.getElementById(`bubble-${msg.id}`);
        if (el) {
          el.textContent = msg.content;
          if (msg.deleted_for_everyone) el.classList.add('deleted-msg');
        }
      });

      socket.on('messages:seen', ({ conversationId }) => {
        if (conversationId === activeConvoId) {
          document.querySelectorAll('.tick').forEach(t => { t.textContent = '✓✓ Seen'; t.style.color = '#38bdf8'; });
        }
      });

      socket.on('typing', ({ conversationId, userId, isTyping }) => {
        if (conversationId === activeConvoId && userId !== me.id) {
          document.getElementById('typing-bar').textContent = isTyping ? 'Typing...' : '';
        }
      });

      socket.on('haptic:tap', ({ conversationId }) => {
        if (conversationId === activeConvoId) {
          if (navigator.vibrate) navigator.vibrate(200);
          document.body.style.boxShadow = 'inset 0 0 60px rgba(0, 210, 255, 0.6)';
          setTimeout(() => document.body.style.boxShadow = 'none', 500);
        }
      });

      setupMediaControls();
      loadUsers();
    }

    function setupMediaControls() {
      const attachBtn = document.getElementById('attach-btn');
      const picker = document.getElementById('media-picker');
      const voiceBtn = document.getElementById('voice-btn');

      attachBtn.onclick = () => {
        if (!activeConvoId) return;
        picker.click();
      };

      picker.onchange = async () => {
        const file = picker.files[0];
        if (!file || !activeConvoId) return;
        await uploadAndSendFile(file, file.name);
        picker.value = '';
      };

      voiceBtn.onclick = async () => {
        if (!activeConvoId) return;
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          voiceBtn.classList.remove('recording');
          voiceBtn.textContent = '🎤';
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            await uploadAndSendFile(blob, 'voice-note.webm');
          };
          mediaRecorder.start();
          voiceBtn.classList.add('recording');
          voiceBtn.textContent = '⏹';
        } catch (err) {
          alert('Microphone access blocked or unavailable: ' + err.message);
        }
      };
    }

    async function uploadAndSendFile(fileBlob, filename) {
      const typingBar = document.getElementById('typing-bar');
      typingBar.textContent = 'Uploading media...';
      try {
        const formData = new FormData();
        formData.append('media', fileBlob, filename);

        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { Authorization: `Bearer ${session.access_token}` },
          body: formData
        }).then(r => r.json());

        if (res.error) {
          alert('Upload failed: ' + res.error);
        } else {
          socket.emit('message:send', {
            clientMsgId: crypto.randomUUID(),
            conversationId: activeConvoId,
            msgType: res.msgType,
            mediaUrl: res.url,
            mediaLiteUrl: res.liteUrl,
            content: ''
          });
        }
      } catch (err) {
        alert('Upload error: ' + err.message);
      } finally {
        typingBar.textContent = '';
      }
    }

    async function loadUsers() {
      const users = await fetch('/api/users', {
        headers: { Authorization: `Bearer ${session.access_token}` }
      }).then(r => r.json());

      const list = document.getElementById('user-list');
      list.innerHTML = '';
      (users || []).forEach(u => {
        const card = document.createElement('div');
        card.className = 'contact-card';
        card.innerHTML = `
          <img class="avatar" src="${u.avatar_url || ''}" onerror="this.style.display='none'" />
          <div>
            <div style="font-weight:600;font-size:14px;">${u.display_name || u.username}</div>
            <div style="font-size:12px;color:var(--muted);">${u.email}</div>
          </div>
          <div id="dot-${u.id}" class="status-dot ${u.is_online ? 'online' : ''}"></div>
        `;
        card.onclick = () => openDirectChat(u);
        list.appendChild(card);
      });
    }

    async function openDirectChat(peer) {
      activePeer = peer;
      document.getElementById('app').classList.add('in-chat');
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('active-chat').style.display = 'flex';
      document.getElementById('peer-name').textContent = peer.display_name || peer.username;
      document.getElementById('peer-avatar').src = peer.avatar_url || '';
      document.getElementById('peer-status').textContent = peer.is_online ? '● Online now' : 'Offline';

      const res = await fetch('/api/chat/direct', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ targetUserId: peer.id })
      }).then(r => r.json());

      activeConvoId = res.conversationId;
      const messagesBox = document.getElementById('messages');
      messagesBox.innerHTML = '';

      (res.messages || []).forEach(renderMessage);
      socket.emit('message:seen', { conversationId: activeConvoId });
    }

    function renderMessage(msg) {
      if (document.getElementById(`wrap-${msg.id}`)) return;
      const isMe = msg.sender_id === me.id;
      const wrap = document.createElement('div');
      wrap.id = `wrap-${msg.id}`;
      wrap.className = `msg-wrap ${isMe ? 'mine' : 'theirs'}`;

      const bubble = document.createElement('div');
      bubble.id = `bubble-${msg.id}`;
      bubble.className = `bubble ${msg.deleted_for_everyone ? 'deleted-msg' : ''}`;

      if (!msg.deleted_for_everyone && msg.media_url) {
        if (msg.msg_type === 'image') {
          const img = document.createElement('img');
          img.src = msg.media_lite_url || msg.media_url;
          img.className = 'chat-media';
          img.onclick = () => window.open(msg.media_url, '_blank');
          bubble.appendChild(img);
        } else if (msg.msg_type === 'video') {
          const vid = document.createElement('video');
          vid.src = msg.media_url;
          vid.controls = true;
          vid.className = 'chat-media';
          bubble.appendChild(vid);
        } else if (msg.msg_type === 'voice') {
          const aud = document.createElement('audio');
          aud.src = msg.media_url;
          aud.controls = true;
          aud.className = 'chat-audio';
          bubble.appendChild(aud);
        }
      }

      if (msg.content) {
        const txt = document.createElement('div');
        txt.textContent = msg.content;
        bubble.appendChild(txt);
      }

      const meta = document.createElement('div');
      meta.className = 'meta-row';
      if (isMe && !msg.deleted_for_everyone) {
        const editAction = msg.msg_type === 'text' ? `<span onclick="editMsg('${msg.id}')">Edit</span>` : '';
        meta.innerHTML = `
          <span class="tick">${msg.status === 'seen' ? '✓✓ Seen' : '✓ Sent'}</span>
          <span class="msg-actions">
            ${editAction}
            <span onclick="delMsg('${msg.id}')">Delete</span>
          </span>`;
      }
      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      const box = document.getElementById('messages');
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    window.editMsg = (id) => {
      const next = prompt('Edit message:');
      if (next && next.trim()) socket.emit('message:edit', { messageId: id, conversationId: activeConvoId, newContent: next.trim() });
    };
    window.delMsg = (id) => {
      if (confirm('Delete for everyone?')) socket.emit('message:delete', { messageId: id, conversationId: activeConvoId });
    };

    document.getElementById('love-tap-btn').onclick = () => {
      if (activeConvoId) socket.emit('haptic:tap', { conversationId: activeConvoId, effect: 'pulse' });
    };

    document.getElementById('input').addEventListener('input', () => {
      if (!activeConvoId) return;
      socket.emit('typing', { conversationId: activeConvoId, isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('typing', { conversationId: activeConvoId, isTyping: false }), 1200);
    });

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      if (!input.value.trim() || !activeConvoId) return;
      socket.emit('message:send', {
        clientMsgId: crypto.randomUUID(),
        conversationId: activeConvoId,
        msgType: 'text',
        content: input.value.trim()
      });
      input.value = '';
    });

    boot();
  </script>
</body>
</html>
